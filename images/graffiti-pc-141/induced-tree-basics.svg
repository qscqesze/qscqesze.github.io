<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">诱导树与普通子图的区别</title>
  <desc id="desc">左侧说明选择顶点后不能随意删除原图中的边，右侧展示一个由所选顶点自动确定且恰好为树的诱导子图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ec"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#102a43" flood-opacity="0.12"/>
    </filter>
    <style>
      .zh { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .edge { stroke: #17324d; stroke-width: 8; stroke-linecap: round; }
      .node { fill: #fffdf8; stroke: #17324d; stroke-width: 7; }
      .picked { fill: #55c5d8; stroke: #17324d; stroke-width: 7; }
      .muted { fill: #d7dee5; stroke: #8494a3; stroke-width: 5; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>

  <text class="zh" x="800" y="84" text-anchor="middle" font-size="50" font-weight="750" fill="#102a43">诱导子图：选顶点之后，边没有选择权</text>
  <text class="zh" x="800" y="132" text-anchor="middle" font-size="25" fill="#52677a">原图中两个入选顶点之间只要有边，诱导子图里就必须保留</text>

  <g filter="url(#shadow)">
    <rect x="78" y="184" width="680" height="606" rx="34" fill="#fffdf8"/>
    <rect x="842" y="184" width="680" height="606" rx="34" fill="#fffdf8"/>
  </g>

  <text class="zh" x="418" y="245" text-anchor="middle" font-size="34" font-weight="700" fill="#102a43">错误直觉：只挑自己喜欢的边</text>
  <text class="zh" x="1182" y="245" text-anchor="middle" font-size="34" font-weight="700" fill="#102a43">诱导树：所有该出现的边都出现</text>

  <!-- Left card: a triangle cannot be turned into a path by hiding one edge. -->
  <g>
    <line class="edge" x1="240" y1="575" x2="418" y2="340"/>
    <line class="edge" x1="418" y1="340" x2="596" y2="575"/>
    <line x1="240" y1="575" x2="596" y2="575" stroke="#e56b5d" stroke-width="10" stroke-linecap="round" stroke-dasharray="20 15"/>
    <circle class="picked" cx="240" cy="575" r="40"/>
    <circle class="picked" cx="418" cy="340" r="40"/>
    <circle class="picked" cx="596" cy="575" r="40"/>
    <text class="zh" x="418" y="650" text-anchor="middle" font-size="27" fill="#52677a">三个顶点在原图中组成三角形</text>
    <g stroke="#c23f35" stroke-width="9" stroke-linecap="round">
      <line x1="385" y1="706" x2="451" y2="772"/>
      <line x1="451" y1="706" x2="385" y2="772"/>
    </g>
    <text class="zh" x="418" y="691" text-anchor="middle" font-size="24" font-weight="700" fill="#c23f35">不能把红边假装删掉</text>
  </g>

  <!-- Right card: selected vertices induce a genuine tree. -->
  <g>
    <line class="edge" x1="1182" y1="410" x2="1010" y2="555"/>
    <line class="edge" x1="1182" y1="410" x2="1182" y2="655"/>
    <line class="edge" x1="1182" y1="410" x2="1354" y2="555"/>
    <line class="edge" x1="1354" y1="555" x2="1450" y2="690"/>
    <circle class="picked" cx="1182" cy="410" r="42"/>
    <circle class="picked" cx="1010" cy="555" r="39"/>
    <circle class="picked" cx="1182" cy="655" r="39"/>
    <circle class="picked" cx="1354" cy="555" r="39"/>
    <circle class="picked" cx="1450" cy="690" r="39"/>

    <!-- Unselected context vertices are outside U and disappear from G[U]. -->
    <line x1="1010" y1="555" x2="943" y2="385" stroke="#aab6c1" stroke-width="5" stroke-dasharray="12 12"/>
    <line x1="943" y1="385" x2="1060" y2="320" stroke="#aab6c1" stroke-width="5" stroke-dasharray="12 12"/>
    <circle class="muted" cx="943" cy="385" r="29"/>
    <circle class="muted" cx="1060" cy="320" r="29"/>
    <text class="zh" x="1182" y="746" text-anchor="middle" font-size="27" fill="#52677a">蓝色顶点之间的全部原有边恰好构成一棵树</text>
  </g>

  <rect x="438" y="815" width="724" height="54" rx="27" fill="#17324d"/>
  <text class="zh" x="800" y="852" text-anchor="middle" font-size="26" font-weight="650" fill="#fffdf8">一句话：诱导子图由“顶点集合”唯一决定</text>
</svg>
