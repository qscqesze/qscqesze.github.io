<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">现代语音大模型从物理信号到语义、声音与行动的技术栈</title>
  <desc id="desc">展示麦克风波形、声学前端、连续或离散表示、多模态语言模型、语音解码器与工具调用之间的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="1" stop-color="#102d3a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f9fa8"/>
      <stop offset="1" stop-color="#52d3c7"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d67b21"/>
      <stop offset="1" stop-color="#f0bb5f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#9cc7ce"/>
    </marker>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;fill:#edf7f7}
      .h{font-size:34px;font-weight:700}.m{font-size:25px;font-weight:650}.s{font-size:20px;fill:#bbd1d4}.xs{font-size:17px;fill:#9bb8bd}
      .box{fill:#123b48;stroke:#34717c;stroke-width:2}.sub{fill:#0d2934;stroke:#2b5b65;stroke-width:2}.line{stroke:#9cc7ce;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text class="t h" x="78" y="72">语音大模型不是一块网络，而是一条从空气振动到行动的栈</text>
  <text class="t s" x="80" y="111">同一段声音同时携带文字、说话人、韵律、情绪、环境与互动时序；每次压缩都在决定保留什么。</text>

  <g filter="url(#shadow)">
    <rect class="box" x="70" y="180" width="250" height="485" rx="24"/>
    <circle cx="195" cy="280" r="62" fill="#0b2732" stroke="#52d3c7" stroke-width="4"/>
    <path d="M112 281 C130 210 148 350 166 268 S202 224 220 295 S258 337 278 266" stroke="#65e1d3" stroke-width="7" fill="none" stroke-linecap="round"/>
    <text class="t m" x="195" y="390" text-anchor="middle">物理声波</text>
    <text class="t s" x="195" y="430" text-anchor="middle">麦克风 → PCM</text>
    <text class="t xs" x="195" y="474" text-anchor="middle">16/24/48 kHz</text>
    <text class="t xs" x="195" y="502" text-anchor="middle">连续、高采样率</text>
    <text class="t xs" x="195" y="552" text-anchor="middle">内容之外还有</text>
    <text class="t xs" x="195" y="580" text-anchor="middle">音色、语气、噪声、停顿</text>
  </g>

  <path class="line" d="M320 422 H385"/>
  <g filter="url(#shadow)">
    <rect class="box" x="390" y="180" width="300" height="485" rx="24"/>
    <text class="t m" x="540" y="235" text-anchor="middle">声学前端</text>
    <rect class="sub" x="425" y="276" width="230" height="72" rx="15"/>
    <text class="t s" x="540" y="321" text-anchor="middle">分帧 / STFT</text>
    <rect class="sub" x="425" y="370" width="230" height="72" rx="15"/>
    <text class="t s" x="540" y="415" text-anchor="middle">Mel 频谱 / 特征</text>
    <rect class="sub" x="425" y="464" width="230" height="72" rx="15"/>
    <text class="t s" x="540" y="509" text-anchor="middle">因果卷积 / 编码器</text>
    <text class="t xs" x="540" y="580" text-anchor="middle">通常 10–20 ms 一帧</text>
    <text class="t xs" x="540" y="610" text-anchor="middle">负责降采样与局部声学建模</text>
  </g>

  <path class="line" d="M690 422 H755"/>
  <g filter="url(#shadow)">
    <rect class="box" x="760" y="145" width="365" height="560" rx="24"/>
    <text class="t m" x="942" y="202" text-anchor="middle">表示与对齐</text>
    <rect x="800" y="244" width="285" height="105" rx="16" fill="#164d5c" stroke="#4a8a96" stroke-width="2"/>
    <text class="t s" x="942" y="286" text-anchor="middle">连续表征</text>
    <text class="t xs" x="942" y="320" text-anchor="middle">SSL encoder / projector</text>
    <rect x="800" y="376" width="285" height="124" rx="16" fill="#164d5c" stroke="#4a8a96" stroke-width="2"/>
    <text class="t s" x="942" y="420" text-anchor="middle">离散语音 token</text>
    <text class="t xs" x="942" y="454" text-anchor="middle">semantic units + RVQ codes</text>
    <text class="t xs" x="942" y="479" text-anchor="middle">约 12.5–50 帧/秒 × 多码本</text>
    <rect x="800" y="527" width="285" height="105" rx="16" fill="#164d5c" stroke="#4a8a96" stroke-width="2"/>
    <text class="t s" x="942" y="569" text-anchor="middle">文本 token</text>
    <text class="t xs" x="942" y="603" text-anchor="middle">转写、内心独白、监督桥梁</text>
    <text class="t xs" x="942" y="671" text-anchor="middle">关键权衡：语义 ↔ 音质 ↔ 序列长度</text>
  </g>

  <path class="line" d="M1125 422 H1190"/>
  <g filter="url(#shadow)">
    <rect x="1195" y="180" width="335" height="485" rx="24" fill="url(#cyan)"/>
    <text class="t m" x="1362" y="236" text-anchor="middle" fill="#06232b">多模态 LLM / 语音 LM</text>
    <rect x="1232" y="274" width="260" height="70" rx="14" fill="#0c4551" opacity=".95"/>
    <text class="t s" x="1362" y="318" text-anchor="middle">理解、推理与对话状态</text>
    <rect x="1232" y="365" width="260" height="70" rx="14" fill="#0c4551" opacity=".95"/>
    <text class="t s" x="1362" y="409" text-anchor="middle">文本 / 音频 token 预测</text>
    <rect x="1232" y="456" width="260" height="70" rx="14" fill="#0c4551" opacity=".95"/>
    <text class="t s" x="1362" y="500" text-anchor="middle">记忆、检索与工具调用</text>
    <text class="t xs" x="1362" y="577" text-anchor="middle" fill="#073039">输出：文字、语音、动作</text>
    <text class="t xs" x="1362" y="610" text-anchor="middle" fill="#073039">流式模型还要同时维护时间轴</text>
  </g>

  <path d="M1362 665 V756" stroke="#9cc7ce" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="1015" y="760" width="205" height="88" rx="18" fill="#7f4d20" stroke="#f0bb5f" stroke-width="2"/>
    <text class="t s" x="1118" y="814" text-anchor="middle">语音解码 / Vocoder</text>
    <rect x="1248" y="760" width="205" height="88" rx="18" fill="#7f4d20" stroke="#f0bb5f" stroke-width="2"/>
    <text class="t s" x="1350" y="814" text-anchor="middle">文本 / 屏幕输出</text>
    <rect x="1481" y="760" width="88" height="88" rx="18" fill="#7f4d20" stroke="#f0bb5f" stroke-width="2"/>
    <text class="t s" x="1525" y="796" text-anchor="middle">API</text>
    <text class="t xs" x="1525" y="824" text-anchor="middle">行动</text>
  </g>
</svg>
