<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">万达商业从香港上市到新达盟重组的关键时间线</title>
  <desc id="desc">2014年香港上市，2016年私有化退市，2017年出售文旅与酒店资产，2018年引入约340亿元新投资，2021年珠海万达商管引入约60亿美元上市前投资，2023年第四次上市申请失效，2024年新达盟重组，2025年48座万达广场股权交易获批。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b2c"/>
      <stop offset="1" stop-color="#102f43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00101e" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1600" height="980" rx="32" fill="url(#bg)"/>
  <text x="90" y="92" fill="#f7fbff" font-size="48" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">万达商业十年：上市、私有化、回购与重组</text>
  <text x="90" y="142" fill="#9bc1d4" font-size="24" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">实线为已经发生的公司事件；金额按当时披露口径，币种不可直接相加</text>
  <line x1="130" y1="490" x2="1470" y2="490" stroke="#55788a" stroke-width="6"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <g filter="url(#shadow)">
      <rect x="70" y="220" width="260" height="205" rx="22" fill="#123b50" stroke="#36c2b4" stroke-width="2"/>
      <text x="100" y="267" fill="#61ded0" font-size="30" font-weight="700">2014</text>
      <text x="100" y="310" fill="#fff" font-size="26" font-weight="650">香港上市</text>
      <text x="100" y="350" fill="#c9dde7" font-size="20">发行价 HK$48</text>
      <text x="100" y="383" fill="#c9dde7" font-size="20">全球发售6亿股H股</text>
    </g>
    <circle cx="200" cy="490" r="14" fill="#36c2b4"/>
    <line x1="200" y1="425" x2="200" y2="476" stroke="#36c2b4" stroke-width="4"/>

    <g filter="url(#shadow)">
      <rect x="370" y="545" width="260" height="205" rx="22" fill="#3d2731" stroke="#ff7c77" stroke-width="2"/>
      <text x="400" y="592" fill="#ff9a96" font-size="30" font-weight="700">2016</text>
      <text x="400" y="635" fill="#fff" font-size="26" font-weight="650">私有化退市</text>
      <text x="400" y="675" fill="#ead2d2" font-size="20">要约价 HK$52.80</text>
      <text x="400" y="708" fill="#ead2d2" font-size="20">总代价约 HK$344.6亿</text>
    </g>
    <circle cx="500" cy="490" r="14" fill="#ff7c77"/>
    <line x1="500" y1="504" x2="500" y2="545" stroke="#ff7c77" stroke-width="4"/>

    <g filter="url(#shadow)">
      <rect x="670" y="220" width="260" height="205" rx="22" fill="#3e3520" stroke="#f6c85f" stroke-width="2"/>
      <text x="700" y="267" fill="#ffd67e" font-size="30" font-weight="700">2017—2018</text>
      <text x="700" y="310" fill="#fff" font-size="26" font-weight="650">售资产、换资本</text>
      <text x="700" y="350" fill="#eadfbf" font-size="20">出售文旅与酒店资产</text>
      <text x="700" y="383" fill="#eadfbf" font-size="20">新投资者投入约340亿元</text>
    </g>
    <circle cx="800" cy="490" r="14" fill="#f6c85f"/>
    <line x1="800" y1="425" x2="800" y2="476" stroke="#f6c85f" stroke-width="4"/>

    <g filter="url(#shadow)">
      <rect x="970" y="545" width="260" height="205" rx="22" fill="#243650" stroke="#79a8ff" stroke-width="2"/>
      <text x="1000" y="592" fill="#9bc0ff" font-size="30" font-weight="700">2021—2023</text>
      <text x="1000" y="635" fill="#fff" font-size="26" font-weight="650">再冲香港IPO</text>
      <text x="1000" y="675" fill="#d2ddf0" font-size="20">上市前融资约 US$60亿</text>
      <text x="1000" y="708" fill="#d2ddf0" font-size="20">四次递表，均未完成上市</text>
    </g>
    <circle cx="1100" cy="490" r="14" fill="#79a8ff"/>
    <line x1="1100" y1="504" x2="1100" y2="545" stroke="#79a8ff" stroke-width="4"/>

    <g filter="url(#shadow)">
      <rect x="1270" y="220" width="260" height="205" rx="22" fill="#173d37" stroke="#6dd5a9" stroke-width="2"/>
      <text x="1300" y="267" fill="#86e3bd" font-size="30" font-weight="700">2024—2025</text>
      <text x="1300" y="310" fill="#fff" font-size="26" font-weight="650">新达盟重组</text>
      <text x="1300" y="350" fill="#d0e7de" font-size="20">机构财团持股60%</text>
      <text x="1300" y="383" fill="#d0e7de" font-size="20">48座广场股权交易获批</text>
    </g>
    <circle cx="1400" cy="490" r="14" fill="#6dd5a9"/>
    <line x1="1400" y1="425" x2="1400" y2="476" stroke="#6dd5a9" stroke-width="4"/>

    <rect x="90" y="825" width="1420" height="80" rx="16" fill="#0b2638" stroke="#294c5e"/>
    <text x="125" y="865" fill="#f7fbff" font-size="23" font-weight="650">主线：</text>
    <text x="205" y="865" fill="#b9d4e1" font-size="22">从“低估值下主动退市”，逐渐变成“以新资本替换旧资本，并用控制权换取到期压力解除”。</text>
  </g>
</svg>
