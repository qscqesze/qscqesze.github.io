<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">猫毛色带与银渐层表型模型</title>
  <desc id="desc">比较非银野鼠色、银虎斑、银渐层和银点色的单根毛干色素分布，并说明群体视觉效果。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#edf1f2"/>
    </linearGradient>
    <linearGradient id="blackTip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#202a30"/>
      <stop offset="0.55" stop-color="#4a565c"/>
      <stop offset="1" stop-color="#171e22"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe6e8"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd4d7"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aa7835"/>
      <stop offset="0.5" stop-color="#e5bd68"/>
      <stop offset="1" stop-color="#9b692d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#26343c" flood-opacity="0.13"/>
    </filter>
    <style>
      .zh { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .serif { font-family: Georgia, "Noto Serif SC", "Songti SC", serif; }
      .label { font-size: 26px; font-weight: 700; fill: #18272e; }
      .sub { font-size: 19px; fill: #53636b; }
      .small { font-size: 16px; fill: #66767d; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0d6b68; }
    </style>
  </defs>

  <rect width="1200" height="690" rx="28" fill="url(#paper)"/>
  <text x="64" y="67" class="zh label" font-size="32">银渐层不是“整根灰毛”：它是毛尖着色的群体光学效应</text>
  <text x="64" y="99" class="zh sub">示意图按表型概念绘制；毛尖比例是品种标准中的近似描述，不是每根毛的显微测量阈值</text>

  <g transform="translate(62 142)" filter="url(#shadow)">
    <rect width="250" height="436" rx="22" fill="#fff" stroke="#d9e0e2"/>
    <text x="25" y="47" class="zh label">非银野鼠色</text>
    <text x="25" y="76" class="zh sub">agouti banding</text>
    <rect x="102" y="103" width="46" height="248" rx="23" fill="url(#blackTip)"/>
    <rect x="102" y="168" width="46" height="100" fill="url(#warm)"/>
    <rect x="102" y="268" width="46" height="43" fill="url(#blackTip)"/>
    <path d="M102 326 Q125 378 148 326 L148 351 Q125 395 102 351Z" fill="#f4f6f5" stroke="#cbd4d7"/>
    <line x1="162" y1="213" x2="211" y2="213" stroke="#b88035" stroke-width="2"/>
    <text x="168" y="202" class="zh small">黄色/红色</text>
    <text x="168" y="224" class="zh small">褐黑素带</text>
    <text x="25" y="394" class="zh small">ASIP–MC1R 通路在毛发生长中</text>
    <text x="25" y="418" class="zh small">切换色素输出，形成明暗色带。</text>
  </g>

  <g transform="translate(337 142)" filter="url(#shadow)">
    <rect width="250" height="436" rx="22" fill="#fff" stroke="#d9e0e2"/>
    <text x="25" y="47" class="zh label">银虎斑</text>
    <text x="25" y="76" class="zh sub">silver tabby</text>
    <rect x="102" y="103" width="46" height="248" rx="23" fill="url(#blackTip)"/>
    <rect x="102" y="168" width="46" height="100" fill="url(#silver)"/>
    <rect x="102" y="268" width="46" height="43" fill="url(#blackTip)"/>
    <path d="M102 326 Q125 378 148 326 L148 351 Q125 395 102 351Z" fill="#f4f6f5" stroke="#cbd4d7"/>
    <line x1="162" y1="213" x2="211" y2="213" stroke="#8fa1a9" stroke-width="2"/>
    <text x="168" y="202" class="zh small">褐黑素被</text>
    <text x="168" y="224" class="zh small">强烈抑制</text>
    <text x="25" y="394" class="zh small">银色效应把原本温暖的色带变成</text>
    <text x="25" y="418" class="zh small">近乎无色；虎斑纹仍清楚可见。</text>
  </g>

  <g transform="translate(612 142)" filter="url(#shadow)">
    <rect width="250" height="436" rx="22" fill="#fff" stroke="#9ec6c3" stroke-width="2"/>
    <text x="25" y="47" class="zh label">银渐层</text>
    <text x="25" y="76" class="code">BSH ns 11</text>
    <rect x="102" y="103" width="46" height="248" rx="23" fill="url(#silver)" stroke="#c3ced1"/>
    <path d="M102 103 Q125 83 148 103 L148 186 L102 186Z" fill="url(#blackTip)"/>
    <path d="M102 326 Q125 378 148 326 L148 351 Q125 395 102 351Z" fill="#f4f6f5" stroke="#cbd4d7"/>
    <line x1="160" y1="151" x2="216" y2="151" stroke="#425158" stroke-width="2"/>
    <text x="166" y="140" class="zh small">约 1/3</text>
    <text x="166" y="162" class="zh small">深色毛尖</text>
    <text x="25" y="394" class="zh small">大量白/淡银底毛叠加均匀毛尖，</text>
    <text x="25" y="418" class="zh small">远看形成从背部向腹侧变浅的“渐层”。</text>
  </g>

  <g transform="translate(887 142)" filter="url(#shadow)">
    <rect width="250" height="436" rx="22" fill="#fff" stroke="#d9e0e2"/>
    <text x="25" y="47" class="zh label">银点色 / 壳色</text>
    <text x="25" y="76" class="code">BSH ns 12</text>
    <rect x="102" y="103" width="46" height="248" rx="23" fill="url(#silver)" stroke="#c3ced1"/>
    <path d="M102 103 Q125 83 148 103 L148 134 L102 134Z" fill="url(#blackTip)"/>
    <path d="M102 326 Q125 378 148 326 L148 351 Q125 395 102 351Z" fill="#f4f6f5" stroke="#cbd4d7"/>
    <line x1="160" y1="119" x2="216" y2="119" stroke="#425158" stroke-width="2"/>
    <text x="166" y="108" class="zh small">约 1/8</text>
    <text x="166" y="130" class="zh small">深色毛尖</text>
    <text x="25" y="394" class="zh small">着色只留在极短毛尖，整体更白，</text>
    <text x="25" y="418" class="zh small">英文常称 chinchilla 或 shell。</text>
  </g>

  <g transform="translate(65 615)">
    <circle cx="11" cy="-4" r="8" fill="#0d6b68"/>
    <text x="30" y="2" class="zh sub">关键：银色效应决定“暖色色带是否被抑制”；11 / 12 描述“毛尖着色的表型程度”。两者不是同一个遗传问题。</text>
  </g>
</svg>
