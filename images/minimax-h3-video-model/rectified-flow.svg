<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MiniMax H3 的联合 Rectified Flow 训练与推理</title>
  <desc id="desc">训练时把干净视频或音频 latent 与高斯噪声线性混合，让同一个 Transformer 预测指向干净数据的速度；推理时视频使用 shift 12、音频使用 shift 3 的不同日程，但每一步在同一次 Transformer 前向中更新。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".6" stop-color="#111d38"/><stop offset="1" stop-color="#251945"/></linearGradient>
    <linearGradient id="train" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#186e98"/><stop offset="1" stop-color="#35bca9"/></linearGradient>
    <linearGradient id="infer" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#694fcb"/><stop offset="1" stop-color="#c15ba8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#a2e5ff"/></marker>
    <marker id="arrowPink" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#f09ad9"/></marker>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <g font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif">
    <text x="70" y="79" fill="#f7fbff" font-size="39" font-weight="760">视频怎样从随机噪声“长”出来：Rectified Flow</text>
    <text x="70" y="123" fill="#aabbd1" font-size="21">H3 预测的是朝向干净数据的速度；公开采样器确认了符号约定和两套 sigma 日程。</text>

    <g filter="url(#shadow)">
      <rect x="70" y="196" width="690" height="548" rx="29" fill="#0c2135" stroke="#38728a" stroke-width="2"/>
      <rect x="70" y="196" width="690" height="70" rx="29" fill="url(#train)"/>
      <text x="111" y="241" fill="#fff" font-size="27" font-weight="780">训练：随机抽一处，学习朝“真视频”走</text>

      <circle cx="158" cy="343" r="58" fill="#25556e" stroke="#69c8df" stroke-width="3"/>
      <path d="M123 351l14-17 13 24 16-45 16 65 16-37 22 22" fill="none" stroke="#ccf6ff" stroke-width="5"/>
      <text x="158" y="428" text-anchor="middle" fill="#c5d8e5" font-size="18" font-weight="700">噪声 ε</text>

      <circle cx="352" cy="343" r="58" fill="#275f57" stroke="#66d1bd" stroke-width="3"/>
      <rect x="319" y="319" width="66" height="48" rx="7" fill="none" stroke="#d4fff3" stroke-width="4"/>
      <path d="M329 356l14-14 11 9 11-12 12 17" fill="none" stroke="#d4fff3" stroke-width="4"/>
      <text x="352" y="428" text-anchor="middle" fill="#c5d8e5" font-size="18" font-weight="700">真实 latent x₀</text>

      <path d="M226 343H274" stroke="#a2e5ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M418 343H469" stroke="#a2e5ff" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="488" y="294" width="215" height="98" rx="19" fill="#183d50" stroke="#57aabd" stroke-width="2"/>
      <text x="596" y="330" text-anchor="middle" fill="#fff" font-size="20" font-weight="730">随机 σ ∈ [0,1]</text>
      <text x="596" y="365" text-anchor="middle" fill="#bfe7ec" font-size="18">xσ=(1−σ)x₀+σε</text>

      <path d="M596 412V463" stroke="#a2e5ff" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="174" y="482" width="482" height="102" rx="21" fill="#17304a" stroke="#577ca4" stroke-width="2"/>
      <text x="415" y="521" text-anchor="middle" fill="#fff" font-size="22" font-weight="740">Omni Transformer(xσ, σ, context)</text>
      <text x="415" y="557" text-anchor="middle" fill="#bdd2e8" font-size="18">预测数据方向速度 vθ ≈ x₀ − ε</text>

      <rect x="174" y="616" width="482" height="70" rx="18" fill="#0f3840"/>
      <text x="415" y="660" text-anchor="middle" fill="#9cf1df" font-size="20" font-weight="720">训练目标：让预测速度贴近真实直线路径</text>
      <text x="415" y="718" text-anchor="middle" fill="#7298b1" font-size="14">公式由公开 Rectified-Flow 采样器的 data-ward 约定还原；官方未披露完整损失权重与采样分布。</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="840" y="196" width="690" height="548" rx="29" fill="#211b41" stroke="#755fc0" stroke-width="2"/>
      <rect x="840" y="196" width="690" height="70" rx="29" fill="url(#infer)"/>
      <text x="881" y="241" fill="#fff" font-size="27" font-weight="780">推理：从 σ=1 的噪声，沿速度场走到 σ=0</text>

      <text x="890" y="320" fill="#d7d2f2" font-size="19" font-weight="700">同一次 Transformer 前向</text>
      <rect x="890" y="349" width="590" height="112" rx="22" fill="#31295c" stroke="#8575d4" stroke-width="2"/>
      <g font-size="17" font-weight="680" text-anchor="middle">
        <rect x="921" y="381" width="150" height="48" rx="13" fill="#3c5591"/><text x="996" y="411" fill="#e5edff">视频 latent</text>
        <rect x="1109" y="381" width="150" height="48" rx="13" fill="#705080"/><text x="1184" y="411" fill="#ffe2f7">音频 latent</text>
        <rect x="1297" y="381" width="150" height="48" rx="13" fill="#24445f"/><text x="1372" y="411" fill="#d9f0ff">文本/参考</text>
      </g>

      <path d="M996 481V530" stroke="#9dbbff" stroke-width="4" marker-end="url(#arrow)"/><path d="M1184 481V530" stroke="#f09ad9" stroke-width="4" marker-end="url(#arrowPink)"/>
      <rect x="892" y="547" width="280" height="94" rx="20" fill="#253c69" stroke="#6689d4"/>
      <text x="1032" y="582" text-anchor="middle" fill="#fff" font-size="20" font-weight="730">视频 sigma 日程</text>
      <text x="1032" y="614" text-anchor="middle" fill="#cbd8ff" font-size="18">shift = 12.0</text>
      <rect x="1200" y="547" width="280" height="94" rx="20" fill="#633d67" stroke="#ad6ca3"/>
      <text x="1340" y="582" text-anchor="middle" fill="#fff" font-size="20" font-weight="730">音频 sigma 日程</text>
      <text x="1340" y="614" text-anchor="middle" fill="#f3d5eb" font-size="18">shift = 3.0</text>

      <path d="M1032 658C1032 699 1340 699 1340 658" fill="none" stroke="#d094e5" stroke-width="3" stroke-dasharray="9 7"/>
      <text x="1186" y="706" text-anchor="middle" fill="#d8c6ef" font-size="18" font-weight="690">各走自己的步长，下一轮再共同注意</text>
    </g>

    <rect x="70" y="789" width="1460" height="67" rx="20" fill="#091728" stroke="#294967" stroke-width="2"/>
    <text x="800" y="831" text-anchor="middle" fill="#c1cfdf" font-size="18"><tspan fill="#82ddff" font-weight="720">CFG 已蒸馏进权重：</tspan>公开 checkpoint 不再跑有条件/无条件两遍，也没有 negative prompt 或 guidance scale。</text>
  </g>
</svg>
