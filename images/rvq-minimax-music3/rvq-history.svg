<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">从经典向量量化到 MiniMax Music 3 的 RVQ 技术谱系</title>
  <desc id="desc">时间线从 1980 年 LBG 向量量化算法、1982 年多级向量量化、2017 年 VQ-VAE、2021 年 SoundStream、2022 年 EnCodec、2023 年 DAC 延伸到 2026 年 MiniMax Music 3。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081421"/><stop offset="1" stop-color="#221b3c"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset=".55" stop-color="#60a5fa"/><stop offset="1" stop-color="#d879ef"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".33"/></filter>
  </defs>
  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <g font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif">
    <text x="55" y="70" fill="#fff" font-size="34" font-weight="750">RVQ 的四十多年：从语音压缩到生成式音乐</text>
    <text x="55" y="108" fill="#9fb2ca" font-size="19">现代 neural RVQ 继承了多级量化的残差思想，又加入了可微训练、神经感知损失和语言模型。</text>
    <line x1="100" y1="376" x2="1300" y2="376" stroke="url(#line)" stroke-width="9" stroke-linecap="round"/>

    <g filter="url(#sh)">
      <rect x="55" y="165" width="205" height="150" rx="20" fill="#10283a" stroke="#2dd4bf"/>
      <text x="78" y="201" fill="#69ead8" font-size="20" font-weight="750">1980 · LBG</text>
      <text x="78" y="235" fill="#fff" font-size="18" font-weight="650">码本怎样训练</text>
      <text x="78" y="266" fill="#9fb2ca" font-size="15">最近邻分配</text>
      <text x="78" y="291" fill="#9fb2ca" font-size="15">更新质心，迭代收敛</text>

      <rect x="290" y="425" width="210" height="166" rx="20" fill="#112a40" stroke="#49b8ea"/>
      <text x="313" y="463" fill="#78d7ff" font-size="20" font-weight="750">1982 · MSVQ</text>
      <text x="313" y="497" fill="#fff" font-size="18" font-weight="650">多级量化残差</text>
      <text x="313" y="528" fill="#9fb2ca" font-size="15">总存储从指数增长</text>
      <text x="313" y="553" fill="#9fb2ca" font-size="15">变为各级开销之和</text>

      <rect x="530" y="165" width="205" height="150" rx="20" fill="#172743" stroke="#6aa8ff"/>
      <text x="553" y="201" fill="#9bc3ff" font-size="20" font-weight="750">2017 · VQ-VAE</text>
      <text x="553" y="235" fill="#fff" font-size="18" font-weight="650">离散瓶颈可训练</text>
      <text x="553" y="266" fill="#9fb2ca" font-size="15">Straight-Through</text>
      <text x="553" y="291" fill="#9fb2ca" font-size="15">码本损失 + commitment</text>

      <rect x="765" y="425" width="210" height="166" rx="20" fill="#252347" stroke="#9278e8"/>
      <text x="788" y="463" fill="#c2b0ff" font-size="20" font-weight="750">2021 · SoundStream</text>
      <text x="788" y="497" fill="#fff" font-size="18" font-weight="650">端到端 neural RVQ</text>
      <text x="788" y="528" fill="#9fb2ca" font-size="15">3–18 kbps</text>
      <text x="788" y="553" fill="#9fb2ca" font-size="15">Quantizer Dropout</text>

      <rect x="1005" y="165" width="165" height="150" rx="20" fill="#312343" stroke="#bd71e8"/>
      <text x="1027" y="201" fill="#e0a8ff" font-size="19" font-weight="750">2022–2023</text>
      <text x="1027" y="235" fill="#fff" font-size="18" font-weight="650">EnCodec / DAC</text>
      <text x="1027" y="266" fill="#9fb2ca" font-size="15">音乐高保真 codec</text>
      <text x="1027" y="291" fill="#9fb2ca" font-size="15">token 成为生成接口</text>

      <rect x="1200" y="425" width="155" height="166" rx="20" fill="#43233e" stroke="#e57bac"/>
      <text x="1220" y="463" fill="#ffb4d3" font-size="19" font-weight="750">2026</text>
      <text x="1220" y="497" fill="#fff" font-size="18" font-weight="650">Music 3</text>
      <text x="1220" y="528" fill="#9fb2ca" font-size="15">1 语义 + 7 声学</text>
      <text x="1220" y="553" fill="#9fb2ca" font-size="15">离散规划 + 连续合成</text>
    </g>

    <g fill="#fff" stroke-width="5">
      <circle cx="157" cy="376" r="13" stroke="#2dd4bf"/><circle cx="395" cy="376" r="13" stroke="#49b8ea"/>
      <circle cx="632" cy="376" r="13" stroke="#6aa8ff"/><circle cx="870" cy="376" r="13" stroke="#9278e8"/>
      <circle cx="1087" cy="376" r="13" stroke="#bd71e8"/><circle cx="1277" cy="376" r="13" stroke="#e57bac"/>
    </g>
    <g stroke="#647b97" stroke-width="2" stroke-dasharray="6 6"><path d="M157 315V363"/><path d="M395 389V425"/><path d="M632 315V363"/><path d="M870 389V425"/><path d="M1087 315V363"/><path d="M1277 389V425"/></g>
    <text x="55" y="663" fill="#8398b4" font-size="16">MSVQ = Multiple-Stage Vector Quantization；“RVQ”是现代论文更常见的名称，但残差级联思想至少可追溯到 1982 年。</text>
  </g>
</svg>
