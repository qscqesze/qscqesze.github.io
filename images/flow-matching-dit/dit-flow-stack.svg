<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Flow Matching 与 DiT 组合后的完整生成栈</title>
  <desc id="desc">图像经 VAE 编码为潜变量，加入噪声后切成 patch token，DiT 在时间与文本条件下预测速度，ODE 求解器多次调用 DiT，最后由 VAE 解码。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17213b"/></linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173c64"/><stop offset="1" stop-color="#3d245f"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78dcff"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg2)"/>
  <text x="55" y="72" fill="#f7f9ff" font-size="34" font-weight="700" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif">谁负责“往哪走”，谁负责“算出这一步”</text>
  <text x="55" y="112" fill="#9db0cc" font-size="20" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif">Flow Matching 定义训练目标与连续动力学；DiT 是参数化速度场的神经网络骨干。</text>

  <g filter="url(#shadow)" font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif">
    <rect x="60" y="176" width="220" height="132" rx="20" fill="#11263d" stroke="#3d678a" stroke-width="2"/>
    <text x="170" y="219" text-anchor="middle" fill="#fff" font-size="23" font-weight="650">真实图像 x</text>
    <text x="170" y="254" text-anchor="middle" fill="#91a9c5" font-size="18">训练数据</text>
    <text x="170" y="281" text-anchor="middle" fill="#91a9c5" font-size="18">H × W × 3</text>

    <rect x="335" y="176" width="220" height="132" rx="20" fill="#11263d" stroke="#3d678a" stroke-width="2"/>
    <text x="445" y="219" text-anchor="middle" fill="#fff" font-size="23" font-weight="650">VAE Encoder</text>
    <text x="445" y="254" text-anchor="middle" fill="#91a9c5" font-size="18">压缩到潜空间</text>
    <text x="445" y="281" text-anchor="middle" fill="#91a9c5" font-size="18">h × w × C</text>

    <rect x="610" y="176" width="280" height="132" rx="20" fill="#11263d" stroke="#3d678a" stroke-width="2"/>
    <text x="750" y="216" text-anchor="middle" fill="#fff" font-size="23" font-weight="650">随机插值 zₜ</text>
    <text x="750" y="253" text-anchor="middle" fill="#91a9c5" font-size="18">(1−t)z₀ + t z₁</text>
    <text x="750" y="281" text-anchor="middle" fill="#72ddff" font-size="17">监督信号：z₁−z₀</text>

    <rect x="945" y="154" width="390" height="425" rx="25" fill="url(#model)" stroke="#775aa6" stroke-width="2"/>
    <text x="1140" y="204" text-anchor="middle" fill="#fff" font-size="29" font-weight="750">DiT 速度网络 vθ</text>
    <rect x="990" y="236" width="300" height="58" rx="13" fill="#091729" fill-opacity=".8"/>
    <text x="1140" y="273" text-anchor="middle" fill="#caeaff" font-size="20">Patchify + 位置编码</text>
    <rect x="990" y="316" width="300" height="118" rx="13" fill="#091729" fill-opacity=".8"/>
    <text x="1140" y="354" text-anchor="middle" fill="#fff" font-size="21" font-weight="650">DiT Block × L</text>
    <text x="1140" y="387" text-anchor="middle" fill="#aabbd4" font-size="17">Self / Joint Attention</text>
    <text x="1140" y="413" text-anchor="middle" fill="#aabbd4" font-size="17">MLP + adaLN / 调制</text>
    <rect x="990" y="456" width="300" height="78" rx="13" fill="#091729" fill-opacity=".8"/>
    <text x="1140" y="488" text-anchor="middle" fill="#fff" font-size="20">Unpatchify</text>
    <text x="1140" y="516" text-anchor="middle" fill="#72ddff" font-size="17">输出 dz/dt</text>
  </g>

  <g stroke="#78dcff" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M280 242H335"/><path d="M555 242H610"/><path d="M890 242H945"/></g>

  <g font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif">
    <rect x="624" y="365" width="266" height="90" rx="18" fill="#14243d" stroke="#46668b" stroke-width="2"/>
    <text x="757" y="401" text-anchor="middle" fill="#fff" font-size="20" font-weight="650">时间条件 t</text>
    <text x="757" y="430" text-anchor="middle" fill="#9eb2ce" font-size="17">Fourier / MLP embedding</text>
    <path d="M890 410H945" stroke="#78dcff" stroke-width="4" marker-end="url(#a)"/>
    <rect x="624" y="480" width="266" height="90" rx="18" fill="#14243d" stroke="#80609f" stroke-width="2"/>
    <text x="757" y="516" text-anchor="middle" fill="#fff" font-size="20" font-weight="650">文本 / 类别条件 c</text>
    <text x="757" y="545" text-anchor="middle" fill="#b7a7d4" font-size="17">CFG 训练时随机置空</text>
    <path d="M890 525H945" stroke="#b990e8" stroke-width="4" marker-end="url(#a)"/>
  </g>

  <rect x="60" y="642" width="1275" height="116" rx="22" fill="#0c192c" stroke="#294665" stroke-width="2"/>
  <g font-family="system-ui,-apple-system,'Noto Sans SC',sans-serif">
    <text x="90" y="687" fill="#fff" font-size="22" font-weight="650">采样闭环</text>
    <text x="90" y="724" fill="#9eb2cc" font-size="18">z₀∼N(0,I)</text>
    <text x="270" y="724" fill="#78dcff" font-size="28">→</text>
    <text x="320" y="724" fill="#cfefff" font-size="18">ODE 求解器反复查询 vθ(zₜ,t,c)</text>
    <text x="720" y="724" fill="#78dcff" font-size="28">→</text>
    <text x="775" y="724" fill="#9eb2cc" font-size="18">z₁</text>
    <text x="855" y="724" fill="#78dcff" font-size="28">→</text>
    <text x="905" y="724" fill="#cfefff" font-size="18">VAE Decoder</text>
    <text x="1095" y="724" fill="#78dcff" font-size="28">→</text>
    <text x="1148" y="724" fill="#ffbf78" font-size="18" font-weight="650">生成图像</text>
  </g>
</svg>
